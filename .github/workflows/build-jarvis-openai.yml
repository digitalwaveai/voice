name: Build clean Jarvis OpenAI installer

on:
  push:
    branches:
      - jarvis-openai-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout build patch
        uses: actions/checkout@v4

      - name: Checkout exact original Jarvis
        shell: pwsh
        run: |
          git clone https://github.com/RustamovAkrom/JARVIS.git jarvis
          git -C jarvis checkout a33d1e8483915d6d5b23f42e9014910ea1ca9e4a

      - name: Apply ONLY Gemini to OpenAI changes
        shell: pwsh
        run: |
          Copy-Item "jarvis-openai-patch\core\assistant.py" "jarvis\core\assistant.py" -Force
          Copy-Item "jarvis-openai-patch\core\config.py" "jarvis\core\config.py" -Force
          Copy-Item "jarvis-openai-patch\core\ai\openai_client.py" "jarvis\core\ai\openai_client.py" -Force
          Copy-Item "jarvis-openai-patch\pyproject.toml" "jarvis\pyproject.toml" -Force
          Copy-Item "jarvis-openai-patch\.env-example" "jarvis\.env-example" -Force
          Copy-Item "jarvis-openai-patch\config.yaml" "jarvis\config.yaml" -Force
          if (Test-Path "jarvis\core\ai\gemini.py") {
            Remove-Item "jarvis\core\ai\gemini.py" -Force
          }

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jarvis/pyproject.toml

      - name: Install original project dependencies
        shell: pwsh
        working-directory: jarvis
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install `
            "comtypes>=1.4.15" `
            "openai>=1.0.0" `
            "numpy>=2.4.1" `
            "pillow>=12.1.0" `
            "pvporcupine>=4.0.1" `
            "pyaudio>=0.2.14" `
            "pycaw>=20251023" `
            "pyinstaller>=6.18.0" `
            "pyside6>=6.10.1" `
            "python-dotenv>=1.2.1" `
            "python-levenshtein>=0.27.3" `
            "pyttsx3>=2.99" `
            "pyyaml>=6.0.3" `
            "rapidfuzz>=3.14.3" `
            "scikit-learn>=1.8.0" `
            "sounddevice>=0.5.4" `
            "vosk>=0.3.45" `
            "websockets>=15.0.1"

      - name: Verify OpenAI replacement
        shell: pwsh
        working-directory: jarvis
        run: |
          python -c "from core.ai.openai_client import OpenAIClient; from core import config; assert config.CONFIG['ai']['provider'] == 'openai'; assert config.AI_MODEL == 'gpt-5.6-luna'; print('OpenAI replacement OK')"
          if (Select-String -Path "core\assistant.py","core\config.py","pyproject.toml","config.yaml" -Pattern "google-genai|from google import genai|GEMINI_API_KEY" -Quiet) {
            throw "Gemini runtime reference still present"
          }

      - name: Build Jarvis exactly with original PyInstaller spec
        shell: pwsh
        working-directory: jarvis
        run: |
          pyinstaller --clean --noconfirm main.spec
          if (!(Test-Path "dist\Jarvis\Jarvis.exe")) {
            throw "PyInstaller did not produce dist\Jarvis\Jarvis.exe"
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress

      - name: Build original Jarvis installer
        shell: pwsh
        working-directory: jarvis
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler not found"
          }
          & $iscc "installer\inno.iss"
          if (!(Test-Path "installer\output\JarvisInstaller.exe")) {
            throw "Inno Setup did not produce JarvisInstaller.exe"
          }
          Get-FileHash "installer\output\JarvisInstaller.exe" -Algorithm SHA256 | Format-List

      - name: Upload JarvisInstaller.exe
        uses: actions/upload-artifact@v4
        with:
          name: JarvisInstaller-OpenAI
          path: jarvis/installer/output/JarvisInstaller.exe
          if-no-files-found: error
          retention-days: 30
